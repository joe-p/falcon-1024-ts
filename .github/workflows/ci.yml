name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (ESM + CJS bundles)
        run: pnpm run build

      - name: Test source (ESM)
        run: pnpm test

      - name: Test built ESM bundle
        run: pnpm run test:esm

      - name: Test built CJS bundle
        run: pnpm run test:cjs
